<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sneaker Style Code Checker</title>
  <link rel="stylesheet" href="popup.css">
  <script type="module" src="popup.js"></script>
</head>
<body>
  <main>
    <header>
      <h1>Sneaker Style Code Checker</h1>
      <p>Paste a style code or listing text to see which full codes match.</p>
    </header>
    <form id="compare-form">
      <div class="inputs">
        <label><span class="label-text">First listing</span>
          <textarea id="first" rows="3" maxlength="20000" placeholder="e.g. Jordan 11 Gamma CT8012-047" spellcheck="false"></textarea>
        </label>
        <label><span class="label-text">Second listing <span class="optional">(optional)</span></span>
          <textarea id="second" rows="3" maxlength="20000" placeholder="e.g. Jordan 11 Gamma 378038-047" spellcheck="false"></textarea>
        </label>
      </div>
      <div class="actions">
        <button type="submit">Check style codes</button>
        <button type="button" id="example">Try an example</button>
        <button type="reset">Clear</button>
      </div>
    </form>
    <section id="results" aria-labelledby="result-title" hidden>
      <h2 id="result-title">Results</h2>
      <p id="status" role="status"></p>
      <ul id="matches"></ul>
    </section>
    <p class="note">A style code helps identify a release. Authenticating an individual pair requires other evidence.</p>
    <footer>
      <a href="https://yegking.net/2026/11/12/sneaker-style-code-reference/" target="_blank" rel="noopener noreferrer">YegKing source data</a>
      <a href="https://reps.shoes/2026/11/06/travis-scott-jordan-1-low-shy-pink-vs-tropical-pink/" target="_blank" rel="noopener noreferrer">Reps Shoes colorway comparison</a>
    </footer>
  </main>
</body>
</html>
